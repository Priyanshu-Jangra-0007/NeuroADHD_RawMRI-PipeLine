name: NeuroADHD RawMRI PoC V2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt

    - name: Run Core Library Unit & Integration Tests (src coverage)
      run: |
        pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml:coverage-src.xml

    - name: Run Synthetic End-to-End Runner Tests (scripts coverage)
      run: |
        pytest tests/integration/test_runner_poc_v2_synthetic.py --cov=scripts.run_poc_v2 --cov-report=term-missing --cov-report=xml:coverage-scripts.xml
