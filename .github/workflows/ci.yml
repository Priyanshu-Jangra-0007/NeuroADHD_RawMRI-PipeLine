name: NeuroADHD RawMRI PoC V2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEUROADHD_HMAC_KEY: "ci_test_synthetic_integrity_key_phase_a11_non_secret"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt

    - name: Validate Dashboard and Pipeline Python/JavaScript
      run: |
        python -m py_compile scripts/serve_dashboard.py scripts/run_synthetic_cohort.py src/dashboard/service.py src/intake/service.py
        node --check frontend/app.js

    - name: Build Container Image & Verify OS Memory Isolation
      run: |
        docker build -t neuro_adhd_pipeline:v2 .
        ./scripts/verify_container_memory.sh

    - name: Run Core Library Unit & Integration Tests (src coverage)
      run: |
        pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml:coverage-src.xml --junitxml=report-tests.xml -rs

    - name: Run Synthetic End-to-End Runner Tests (scripts coverage)
      run: |
        pytest tests/integration/test_runner_poc_v2_synthetic.py --cov=scripts.run_poc_v2 --cov-report=term-missing --cov-report=xml:coverage-scripts.xml --junitxml=report-scripts.xml

    - name: Report Dynamic CI Test Execution Summary & Model Status
      run: |
        python scripts/ci_test_summary.py --xml report-tests.xml report-scripts.xml --markdown test-summary.md

    - name: Upload Test and Verification Evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-and-verification-evidence
        path: |
          report-tests.xml
          report-scripts.xml
          coverage-src.xml
          coverage-scripts.xml
          test-summary.md
        retention-days: 30

  dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit

    - name: Audit requirements-lock.txt for known vulnerabilities
      run: pip-audit -r requirements-lock.txt

  repo-hygiene:
    name: Tracked File & Path Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check prohibited tracked files and local user path strings
      run: |
        python3 - <<'PYEOF'
        import os
        import subprocess
        import sys

        raw = subprocess.check_output(["git", "ls-files", "-z"])
        tracked = [p.decode("utf-8", errors="surrogateescape") for p in raw.split(b"\0") if p]

        forbidden_path_token = b"/Users" + b"/"
        allowed_nifti = "data/atlases/cc200_roi_atlas.nii.gz"
        failures = []

        for path in tracked:
            lower = path.lower()
            base = os.path.basename(path)
            if lower.endswith(".dcm"):
                failures.append(f"Prohibited DICOM file tracked: {path}")
            elif lower.endswith(".nii"):
                failures.append(f"Prohibited NIfTI file tracked: {path}")
            elif lower.endswith(".nii.gz") and path != allowed_nifti:
                failures.append(f"Prohibited compressed NIfTI file tracked: {path}")
            elif base == ".env":
                failures.append(f"Prohibited .env file tracked: {path}")
            elif lower.endswith(".pem"):
                failures.append(f"Prohibited PEM file tracked: {path}")

            if os.path.isfile(path):
                with open(path, "rb") as fh:
                    if forbidden_path_token in fh.read():
                        failures.append(f"Prohibited local path string found in tracked file: {path}")

        if failures:
            for msg in failures:
                print(f"::error::{msg}")
            sys.exit(1)

        print(f"Hygiene check passed across {len(tracked)} tracked files.")
        PYEOF
